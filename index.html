<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fichas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7f8;
      --card: #fff;
      --ink: #12303b;
      --line: #d5e0e4;
      --accent: #0e7c86;
      --accent-ink: #fff;
      --coin: #e0a526;
      --ok: #1b7f4b;
      --err: #b3261e;
      color-scheme: light
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1b21;
        --card: #16272f;
        --ink: #e6f0f3;
        --line: #2a414b;
        --accent: #3cb4bf;
        --accent-ink: #06242a;
        --coin: #f0be45;
        --ok: #5bd08d;
        --err: #ff8a80;
        color-scheme: dark
      }
    }

    * {
      box-sizing: border-box
    }

    [hidden] {
      display: none !important
    }

    html,
    body {
      margin: 0
    }

    body {
      font-family: Figtree, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
      min-height: 100vh
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 8px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    h1 i {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--coin);
      display: inline-block;
      box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .12)
    }

    form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      display: grid;
      gap: 16px
    }

    label,
    .lbl {
      font-weight: 600;
      font-size: .9rem;
      display: block;
      margin-bottom: 6px
    }

    input[type=text],
    input[type=number],
    input[type=date] {
      width: 100%;
      font: inherit;
      font-size: 1.1rem;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink)
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .who {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px
    }

    .who label {
      margin: 0
    }

    .who input {
      position: absolute;
      opacity: 0
    }

    .who span {
      display: block;
      text-align: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      background: var(--card)
    }

    .who input:checked+span {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent)
    }

    .who input:focus-visible+span {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .modo {
      margin-bottom: 14px
    }

    .modo span {
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 800
    }

    .profit {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 14px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px dashed var(--line)
    }

    .profit b {
      font-size: 1.6rem;
      font-weight: 800
    }

    #stock.low {
      color: var(--err)
    }

    button {
      font: inherit;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer
    }

    button:disabled {
      opacity: .6
    }

    .msg {
      min-height: 1.4em;
      font-weight: 600;
      text-align: center
    }

    .msg.ok {
      color: var(--ok)
    }

    .msg.err {
      color: var(--err)
    }

    .sheet {
      display: block;
      margin-top: 14px;
      text-align: center;
      padding: 14px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-weight: 800;
      text-decoration: none
    }
  </style>
</head>

<body>
  <main>
    <h1><i></i>Fichas</h1>

    <div class="profit" style="margin-bottom:14px;align-items:center"><span>Fichas en stock</span><b id="stock">–</b></div>

    <div class="who modo" role="radiogroup" aria-label="Tipo de carga">
      <label><input type="radio" name="modo" value="venta" checked><span>Venta</span></label>
      <label><input type="radio" name="modo" value="compra"><span>Compra</span></label>
    </div>

    <form id="fv" autocomplete="off">
      <div><span class="lbl">¿Quién carga?</span>
        <div class="who">
          <label><input type="radio" name="quienV" value="Mateo" required><span>Mateo</span></label>
          <label><input type="radio" name="quienV" value="Mariano"><span>Mariano</span></label>
        </div>
      </div>
      <div class="row">
        <div><label for="cliente">Nombre</label>
          <input type="text" id="cliente" list="clientes"><datalist id="clientes"></datalist>
        </div>
        <div><label for="depto">Departamento</label>
          <input type="text" id="depto" list="deptos"><datalist id="deptos"></datalist>
        </div>
      </div>
      <div class="row">
        <div><label for="cant">Cantidad de fichas</label><input type="number" id="cant" inputmode="numeric" min="1"
            step="1" required></div>
        <div><label for="fecha">Fecha</label><input type="date" id="fecha" required></div>
      </div>
      <div class="row">
        <div><label for="compra">Precio compra (c/u)</label><input type="number" id="compra" inputmode="decimal" min="0"
            step="any" required></div>
        <div><label for="venta">Precio venta (c/u)</label><input type="number" id="venta" inputmode="decimal" min="0"
            step="any" required></div>
      </div>
      <div class="profit"><span>Total</span><b id="gan">$ 0</b></div>
      <button id="btn" type="submit">Guardar venta</button>
      <div id="msgV" class="msg" role="status" aria-live="polite"></div>
    </form>

    <form id="fc" autocomplete="off" hidden>
      <div><span class="lbl">¿Quién compró?</span>
        <div class="who">
          <label><input type="radio" name="quienC" value="Mateo" required><span>Mateo</span></label>
          <label><input type="radio" name="quienC" value="Mariano"><span>Mariano</span></label>
        </div>
      </div>
      <div><label for="lugar">Lugar</label>
        <input type="text" id="lugar" list="lugares" required><datalist id="lugares"></datalist>
      </div>
      <div class="row">
        <div><label for="cantC">Cantidad de fichas</label><input type="number" id="cantC" inputmode="numeric" min="1"
            step="1" required></div>
        <div><label for="fechaC">Fecha</label><input type="date" id="fechaC" required></div>
      </div>
      <div><label for="precioC">Precio por ficha</label><input type="number" id="precioC" inputmode="decimal" min="0"
          step="any" required></div>
      <div class="profit"><span>Total</span><b id="total">$ 0</b></div>
      <button id="btnC" type="submit">Guardar compra</button>
      <div id="msgC" class="msg" role="status" aria-live="polite"></div>
    </form>

    <a class="sheet" id="sheetLink" target="_blank" rel="noopener">Abrir el Google Sheets</a>
  </main>
  <script>
    // URL de la aplicación web de Apps Script (termina en /exec)
    const API = "https://script.google.com/macros/s/AKfycbzKcqGy5MQpF_m1vpbqHgGpmUK-S8cD-9k1OhvUokTHLe-zPY8LXerikB135CIyWpmcSA/exec";
    // Dirección del Google Sheet
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/18Q6wyZ37S8xd4O24x14DCJ_WGi8ebrY2hRGlW6VRJDQ/edit?gid=1559333675#gid=1559333675";

    const $ = id => document.getElementById(id);
    const store = {
      get(k) { try { return localStorage.getItem(k) } catch (e) { return null } },
      set(k, v) { try { localStorage.setItem(k, v) } catch (e) { } }
    };
    const money = n => "$ " + (Math.round(n) || 0).toLocaleString("es-AR");
    const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
    const say = (id, text, cls) => { const m = $(id); m.textContent = text; m.className = "msg " + (cls || ""); };

    $("sheetLink").href = SHEET_URL;

    function addOpt(list, v) {
      if (!v || [...list.options].some(o => o.value === v)) return;
      const o = document.createElement("option"); o.value = v; list.appendChild(o);
    }

    // Muestra el stock y lo pinta de rojo si está por debajo del límite de aviso
    function pintarStock(d) {
      if (d.stock === undefined) return;
      const s = $("stock");
      s.textContent = d.stock;
      s.classList.toggle("low", d.limite !== undefined && d.stock < d.limite);
    }

    function cargarStock() {
      fetch(API + "?solo=stock&t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(pintarStock).catch(() => { });
    }

    async function enviar(payload) {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || "Error");
      cargarStock();
      return res;
    }

    // ---------- Venta / Compra ----------
    function setModo() {
      const m = document.querySelector("input[name=modo]:checked").value;
      $("fv").hidden = m !== "venta"; $("fc").hidden = m !== "compra";
      store.set("modo", m);
    }
    document.querySelectorAll("input[name=modo]").forEach(r => r.addEventListener("change", setModo));
    const modoGuardado = store.get("modo");
    if (modoGuardado) document.querySelector(`input[name=modo][value="${modoGuardado}"]`).checked = true;
    setModo();

    $("fecha").value = today(); $("fechaC").value = today();
    $("compra").value = store.get("compra") || "";
    $("precioC").value = store.get("compra") || "";
    const q = store.get("quien");
    if (q) ["quienV", "quienC"].forEach(n => { document.querySelector(`input[name=${n}][value="${q}"]`).checked = true; });

    function calcV() {
      const t = $("venta").value * $("cant").value;
      $("gan").textContent = isFinite(t) ? money(t) : "$ 0";
    }
    function calcC() {
      const t = $("cantC").value * $("precioC").value;
      $("total").textContent = isFinite(t) ? money(t) : "$ 0";
    }
    let ventaTocado = false;
    $("venta").addEventListener("input", () => { ventaTocado = true; calcV(); });
    $("compra").addEventListener("input", calcV);
    $("cant").addEventListener("input", () => {
      if (!ventaTocado) { const c = Number($("cant").value); $("venta").value = c >= 10 ? 3200 : (c > 0 ? 3500 : ""); }
      calcV();
    });
    ["cantC", "precioC"].forEach(id => $(id).addEventListener("input", calcC));
    calcV(); calcC();

    // Carga inicial: stock y listas para los desplegables
    fetch(API).then(r => r.json()).then(d => {
      pintarStock(d);
      (d.clientes || []).forEach(c => addOpt($("clientes"), c));
      (d.deptos || []).forEach(x => addOpt($("deptos"), x));
      (d.lugares || []).forEach(l => addOpt($("lugares"), l));
    }).catch(() => { });

    // Actualiza el stock al volver a la app y cada 30 segundos
    document.addEventListener("visibilitychange", () => { if (!document.hidden) cargarStock(); });
    setInterval(() => { if (!document.hidden) cargarStock(); }, 30000);

    $("fv").addEventListener("submit", async e => {
      e.preventDefault();
      const data = {
        tipo: "venta", cantidad: Number($("cant").value),
        cliente: $("cliente").value.trim(), depto: $("depto").value.trim(),
        compra: Number($("compra").value), venta: Number($("venta").value), fecha: $("fecha").value,
        quien: document.querySelector("input[name=quienV]:checked").value
      };
      if (!data.cliente && !data.depto) return say("msgV", "Poné al menos nombre o departamento.", "err");
      $("btn").disabled = true; say("msgV", "Guardando…");
      try {
        await enviar(data);
        store.set("compra", data.compra); store.set("quien", data.quien);
        say("msgV", "Venta guardada: " + data.cantidad + " fichas para " + (data.cliente || data.depto) + ".", "ok");
        addOpt($("clientes"), data.cliente); addOpt($("deptos"), data.depto);
        $("cant").value = ""; $("cliente").value = ""; $("depto").value = ""; $("venta").value = ""; ventaTocado = false; calcV(); $("cliente").focus();
      } catch (err) {
        say("msgV", "No se pudo guardar. Revisá la conexión y probá de nuevo.", "err");
      } finally { $("btn").disabled = false; }
    });

    $("fc").addEventListener("submit", async e => {
      e.preventDefault();
      const data = {
        tipo: "compra", fecha: $("fechaC").value, quien: document.querySelector("input[name=quienC]:checked").value,
        lugar: $("lugar").value.trim(), cantidad: Number($("cantC").value), precio: Number($("precioC").value)
      };
      $("btnC").disabled = true; say("msgC", "Guardando…");
      try {
        await enviar(data);
        store.set("compra", data.precio); store.set("quien", data.quien); $("compra").value = data.precio; calcV();
        say("msgC", "Compra guardada: " + data.cantidad + " fichas en " + data.lugar + ".", "ok");
        addOpt($("lugares"), data.lugar);
        $("cantC").value = ""; calcC(); $("cantC").focus();
      } catch (err) {
        say("msgC", "No se pudo guardar. Revisá la conexión y probá de nuevo.", "err");
      } finally { $("btnC").disabled = false; }
    });
  </script>
</body>

</html>
